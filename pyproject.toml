[project]
name = "forgettrace"
version = "0.1.0"
description = "An agent for provable data erasure — traces DataHub lineage to find every downstream copy of a subject's data and produces a signed compliance audit trail."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "mcp[cli]>=1.3.0",
    "click>=8.1.0",
    "rich>=13.7.0",
]

[project.scripts]
forgettrace = "forgettrace.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forgettrace"]
